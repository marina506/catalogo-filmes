<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Catálogo de Filmes{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
            color: #263445;
        }

        header {
            background-color: #172b4d;
            color: white;
            padding: 20px;
        }

        nav {
            max-width: 1000px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        nav h1 {
            margin: 0;
            font-size: 24px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        nav a:hover {
            color: #70d6c3;
        }

        main {
            max-width: 1000px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .botao {
            display: inline-block;
            padding: 10px 16px;
            background-color: #087f8c;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .botao:hover {
            background-color: #066570;
        }

        .excluir {
            background-color: #c0392b;
        }

        .excluir:hover {
            background-color: #962d22;
        }

        .mensagem {
            background-color: #d9f5e5;
            color: #17663b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #65758b;
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                align-items: flex-start;
            }

            nav a {
                margin-left: 0;
                margin-right: 12px;
            }
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <h1>🎬 Catálogo de Filmes</h1>

            <div>
                <a href="{{ url_for('index') }}">Início</a>
                <a href="{{ url_for('adicionar') }}">Cadastrar filme</a>
            </div>
        </nav>
    </header>

    <main>
        {% with mensagens = get_flashed_messages() %}
            {% for mensagem in mensagens %}
                <div class="mensagem">{{ mensagem }}</div>
            {% endfor %}
        {% endwith %}

        {% block conteudo %}{% endblock %}
    </main>

    <footer>
        <p>Catálogo de Filmes | Projeto UC32</p>
    </footer>
</body>
</html>
